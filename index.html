function html5Source(raw){
 const val=String(raw||'').trim();
 if(!val||/[<>"'`]/.test(val))return '';
 try{
  const url=new URL(val,document.baseURI);
  if(!['https:','http:'].includes(url.protocol)||!/\.(mp4|webm)$/i.test(url.pathname))return '';
  if(url.protocol==='http:' && url.origin!==location.origin)return '';
  return val;
 }catch(e){return ''}
}
function youtubeIframe(id,title){
  return `<iframe title="${esc(title)}" src="https://www.youtube-nocookie.com/embed/${id}?rel=0&playsinline=1" allow="encrypted-media; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" loading="lazy" allowfullscreen></iframe>`;
}
function videoMarkup(raw,title){
 const file=html5Source(raw);
 if(file)return `<video title="${esc(title)}" playsinline controls preload="metadata"><source src="${esc(file)}" type="video/${/\.webm(?:$|\?)/i.test(file)?'webm':'mp4'}">Your browser does not support this video.</video>`;
 const id=ytId(raw);
 return id?youtubeIframe(id,title):'';
}

function setApplicationStep(i,scroll=true){
 const form=document.getElementById('application');if(!form)return;
 applicationStep=Math.max(0,Math.min(2,i));
 form.querySelectorAll('[data-application-step]').forEach((el,n)=>{el.hidden=n!==applicationStep;});
 document.getElementById('application-step-count').textContent=`STEP ${applicationStep+1} OF 3`;
 document.getElementById('application-step-title').textContent=applicationStages[applicationStep].name;
 document.getElementById('application-question-count').textContent=applicationStages[applicationStep].count;
 document.getElementById('application-progress-value').textContent=`${applicationStep+1} / 3`;
 const progress=document.querySelector('.application-progress');progress.setAttribute('aria-valuenow',String(applicationStep+1));
 form.closest('.application-card').querySelector('.application-progress-fill').style.width=`${(applicationStep+1)*100/3}%`;
 form.querySelector('[data-app-back]').hidden=applicationStep===0;
 form.querySelector('[data-app-next]').hidden=applicationStep===2;
 form.querySelector('[data-app-next]').textContent=applicationStages[applicationStep].next;
 form.querySelector('[data-app-submit]').hidden=applicationStep!==2;
 if(scroll){const card=form.closest('.application-card');card.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}
}
function validateApplicationStep(index){
 const form=document.getElementById('application');
 const panel=form?.querySelector(`[data-application-step="${index}"]`);if(!panel)return false;
 for(const field of panel.querySelectorAll('input, textarea, select')){
  if(field.disabled)continue;
  if(!field.checkValidity()){
   if(applicationStep!==index)setApplicationStep(index,false);
   field.reportValidity();
   return false;
  }
 }
 return true;
}

function selectOffer(next,instant=false){
 const track=document.getElementById('offer-track');if(!track)return;
 offerSlide=(next+3)%3;
 const cards=[...track.querySelectorAll('[data-offer-card]')];
 document.querySelectorAll('[data-offer-slide]').forEach(t=>t.setAttribute('aria-selected',String(Number(t.dataset.offerSlide)===offerSlide)));
 cards.forEach((card,i)=>{card.classList.toggle('is-active',i===offerSlide);card.setAttribute('aria-hidden',String(i!==offerSlide));if(i===offerSlide)card.removeAttribute('inert');else card.setAttribute('inert','');});
 const counter=document.getElementById('offer-counter');if(counter)counter.innerHTML='<b>0'+(offerSlide+1)+'</b> / 03';
 const gap=parseFloat(getComputedStyle(track).gap)||12;
 const px=offerSlide*((cards[0]?.getBoundingClientRect().width||0)+gap);
 if(instant){track.style.transition='none';track.style.transform='translate3d(-'+px+'px,0,0)';track.offsetHeight;track.style.transition='';}
 else track.style.transform='translate3d(-'+px+'px,0,0)';
}
// Testimonial carousel: duplicate the ENTIRE six-card set either side of the originals.
// One cloned boundary card is not enough when three or four cards fit across the viewport:
// it leaves a blank end-of-track region. Three complete sets guarantee continuous cards.
let quotePos=0, quoteCount=0, quoteEntrancePlayed=false, quoteObserver=null;
let quoteAnimating=false, quoteQueued=0;
function quoteMoveTo(next,animated=true){
 const track=document.getElementById('spx-quotes-track');if(!track||!quoteCount)return;
 const cards=track.children;
 quotePos=next;
 const px=cards[quotePos]?.offsetLeft||0;
 track.style.transition=animated?'transform .52s cubic-bezier(.2,.75,.2,1)':'none';
 track.style.transform=`translate3d(-${px}px,0,0)`;
 const actual=((quotePos-quoteCount)%quoteCount+quoteCount)%quoteCount+1;
 const counter=document.getElementById('spx-testimonial-count');
 if(counter)counter.innerHTML=String(actual).padStart(2,'0')+' <span>/ '+String(quoteCount).padStart(2,'0')+'</span>';
}
function quoteFinishMove(){
 // Jump invisibly between identical copies only AFTER the animated slide has completed.
 if(quotePos<quoteCount)quoteMoveTo(quotePos+quoteCount,false);
 else if(quotePos>=quoteCount*2)quoteMoveTo(quotePos-quoteCount,false);
 quoteAnimating=false;
 if(quoteQueued){
  const dir=Math.sign(quoteQueued);quoteQueued-=dir;
  requestAnimationFrame(()=>quoteStep(dir));
 }
}
function quoteStep(direction){
 const track=document.getElementById('spx-quotes-track');if(!track||!quoteCount)return;
 const dir=direction<0?-1:1;
 if(quoteAnimating){quoteQueued=Math.max(-12,Math.min(12,quoteQueued+dir));return;}
 const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 quoteAnimating=!reducedMotion;
 quoteMoveTo(quotePos+dir,!reducedMotion);
 if(reducedMotion)quoteFinishMove();
}
function setupQuotes(){
 const track=document.getElementById('spx-quotes-track');if(!track)return;
 if(quoteObserver){quoteObserver.disconnect();quoteObserver=null;}
 const originals=[...track.querySelectorAll('[data-quote-card]:not(.spx-quote-clone)')];
 quoteCount=originals.length;if(!quoteCount)return;
 const cloneSet=()=>originals.map(card=>{
  const copy=card.cloneNode(true);
  copy.classList.add('spx-quote-clone');copy.setAttribute('aria-hidden','true');
  copy.setAttribute('inert','');
  return copy;
 });
 track.prepend(...cloneSet());track.append(...cloneSet());
 quotePos=quoteCount;quoteQueued=0;quoteAnimating=false;quoteEntrancePlayed=false;
 quoteMoveTo(quotePos,false);
 track.addEventListener('transitionend',e=>{
  if(e.target!==track||e.propertyName!=='transform'||!quoteAnimating)return;
  quoteFinishMove();
 });
 if('IntersectionObserver' in window){
  quoteObserver=new IntersectionObserver(entries=>{
   if(!entries.some(e=>e.isIntersecting)||quoteEntrancePlayed)return;
   quoteEntrancePlayed=true;quoteObserver.disconnect();quoteObserver=null;
   if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    // One introductory slide as the section enters view, then manual navigation.
    setTimeout(()=>{if(document.getElementById('spx-quotes-track')===track)quoteStep(1)},600);
   }
  },{threshold:.28});
  quoteObserver.observe(document.getElementById('client-stories'));
 }
}

document.addEventListener('submit',e=>{const f=e.target;if(!f.id)return;e.preventDefault();const d=Object.fromEntries(new FormData(f).entries());if(f.id==='application'){
  for(let i=0;i<3;i++){if(!validateApplicationStep(i))return;}
  for(const field of ['challenge','obstacle'])if(d[field]==='Something else')d[field]=String(d[field+'Other']||'').trim();
  d.type='application';d.interest=d.challenge;d.goal=d.why;d.date=new Date().toISOString();
  leads.unshift(d);save();go('submitted');return;
 }if(f.id==='enquiry'){leads.unshift({...d,date:new Date().toISOString()});save();modal={type:'enquiry'};renderModal();f.reset();return}if(f.id==='admin-content'){for(const k of ['heroTitle','heroAccent','heroSubtitle','heroImage','offersHeading','offersQuestion','oneTitle','oneDesc','oneBest','corpTitle','corpDesc','corpBest','docTitle','docDesc','docBest','oneImage','corpImage','docImage'])content[k]=d[k]||'';save();render();alert('Changes saved in this browser.');return}if(f.id==='admin-packages'){content.plans.forEach((p,i)=>{p.name=d['name'+i]||'';p.price=d['price'+i]||'';p.description=d['description'+i]||''});save();render();alert('Packages updated.');return}if(f.id==='admin-videos'){content.introVideo=d.introVideo||'';content.coachingVideo=d.coachingVideo||'';content.ironmanVideo=d.ironmanVideo||'';content.corporateVideo=d.corporateVideo||'';content.storyVideo=d.storyVideo||'';save();render();alert('Video links saved.');return}});
const start=location.hash.replace('#','');if(['home','coaching','ironman','corporate','apply','submitted','admin'].includes(start))route=start;else if(start==='stories')route='home';render();if(start==='stories')requestAnimationFrame(()=>document.getElementById('client-stories')?.scrollIntoView());
})();
